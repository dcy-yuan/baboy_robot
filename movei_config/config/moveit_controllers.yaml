# MoveIt uses this configuration for controller management

moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

moveit_simple_controller_manager:
  controller_names:
    - left_arm_controller
    - right_arm_controller
    - dual_controller

  left_arm_controller:
    type: FollowJointTrajectory
    joints:
      - left_jt1
      - left_jt2
      - left_jt3
      - left_jt4
      - left_jt5
      - left_jt6
    action_ns: follow_joint_trajectory
    default: true
  right_arm_controller:
    type: FollowJointTrajectory
    joints:
      - right_jt1
      - right_jt2
      - right_jt3
      - right_jt4
      - right_jt5
      - right_jt6
    action_ns: follow_joint_trajectory
    default: true
  dual_controller:
    type: FollowJointTrajectory
    joints:
      - left_jt1
      - left_jt2
      - left_jt3
      - left_jt4
      - left_jt5
      - left_jt6
      - right_jt1
      - right_jt2
      - right_jt3
      - right_jt4
      - right_jt5
      - right_jt6
    action_ns: follow_joint_trajectory
    default: true