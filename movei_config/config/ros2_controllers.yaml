# This config file is used by ros2_control
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    left_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    right_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    dual_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

left_arm_controller:
  ros__parameters:
    joints:
      - left_jt1
      - left_jt2
      - left_jt3
      - left_jt4
      - left_jt5
      - left_jt6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
right_arm_controller:
  ros__parameters:
    joints:
      - right_jt1
      - right_jt2
      - right_jt3
      - right_jt4
      - right_jt5
      - right_jt6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
dual_controller:
  ros__parameters:
    joints:
      - left_jt1
      - left_jt2
      - left_jt3
      - left_jt4
      - left_jt5
      - left_jt6
      - right_jt1
      - right_jt2
      - right_jt3
      - right_jt4
      - right_jt5
      - right_jt6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity